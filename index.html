<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step 1: โครงร่างหลักอ่านไฟล์ Excel — ระบบจัดการข้อมูลใบงาน</title>
    <meta name="description" content="ระบบนำเข้าและตรวจสอบความถูกต้องของข้อมูลใบงานจากไฟล์ Excel (.xlsx, .xls) และ CSV" />
    <meta property="og:title" content="Step 1: โครงร่างหลักอ่านไฟล์ Excel — ระบบจัดการข้อมูลใบงาน" />
    <meta property="og:description" content="ระบบนำเข้าและตรวจสอบความถูกต้องของข้อมูลใบงานจากไฟล์ Excel (.xlsx, .xls) และ CSV" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- ฟอนต์ภาษาไทยอ่านง่าย -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS (ประมวลผลผ่าน Vite + @tailwindcss/vite) -->
    <link rel="stylesheet" href="/src/index.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">

        <!-- ส่วนหัวของหน้าเว็บ -->
        <header class="bg-slate-900 text-white p-6 rounded-xl shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold">ระบบจัดการข้อมูลใบงาน (โครงร่างหลัก Step 1)</h1>
                <p class="text-xs text-slate-400 mt-1">ทดสอบการนำเข้าไฟล์ Excel และแสดงผลตารางข้อมูลดิบทั้งหมด</p>
            </div>
            <div id="statusBadge" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300">
                สถานะ: รอการนำเข้าไฟล์
            </div>
        </header>

        <!-- กล่องอัปโหลดไฟล์ Excel -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <label for="excelFileInput" class="block text-sm font-bold text-slate-700 mb-3">เลือกไฟล์ Excel (.xlsx, .xls) หรือ CSV</label>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv"
                   class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-5 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer border border-slate-300 rounded-lg bg-slate-50" />
        </section>

        <!-- พื้นที่สำหรับวางปุ่มคำสั่งเพิ่มเติมในอนาคต (Step 3) -->
        <div id="actionToolbar" class="hidden flex-wrap gap-3">
            <!-- เตรียมพื้นที่ไว้สำหรับใส่ปุ่มในขั้นตอนถัดไป -->
        </div>

        <!-- ตารางแสดงผลข้อมูลดิบ -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 text-sm">ตารางข้อมูลจากไฟล์</h2>
                <span id="rowCount" class="text-xs font-semibold text-blue-700 bg-blue-50 px-3 py-1 rounded-full border border-blue-200">
                    ทั้งหมด 0 แถว
                </span>
            </div>

            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="sticky top-0 z-10 bg-slate-100">
                        <tr id="tableHeader" class="text-slate-700 text-xs font-bold border-b border-slate-200">
                            <!-- หัวตารางจะขึ้นตรงนี้อัตโนมัติ -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-slate-700">
                        <tr>
                            <td class="text-center py-12 text-slate-400">กรุณาเลือกไฟล์ Excel ด้านบนเพื่อแสดงข้อมูล</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script type="module">
        import * as XLSX from 'xlsx';

        // ตัวแปรส่วนกลางสำหรับเก็บข้อมูลที่อ่านได้จาก Excel
        let rawData = [];

        const fileInput = document.getElementById("excelFileInput");
        const statusBadge = document.getElementById("statusBadge");

        // ดักจับเหตุการณ์เมื่อผู้ใช้เลือกไฟล์
        fileInput.addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // อัปเดตป้ายสถานะ
            statusBadge.textContent = `กำลังอ่านไฟล์: ${file.name}`;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    // อ่านไฟล์ด้วย SheetJS
                    const workbook = XLSX.read(data, { type: "array" });

                    if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
                        throw new Error("ไม่พบแผ่นงาน (Sheet) ในไฟล์นี้");
                    }

                    // เลือกแผ่นงาน (Sheet) แรกสุด
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // แปลงข้อมูลทั้งหมดเป็น JSON Array (เก็บค่าว่างเป็น "" และใช้ค่าที่ format ตาม Excel)
                    rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });

                    statusBadge.textContent = `โหลดสำเร็จ: ${file.name} (ชีต: ${firstSheetName})`;
                    renderRawTable(rawData);
                } catch (err) {
                    rawData = [];
                    statusBadge.textContent = `เกิดข้อผิดพลาดในการอ่านไฟล์: ${err.message || "ไฟล์ไม่ถูกต้อง"}`;
                    renderRawTable([]);
                }
            };

            reader.onerror = function() {
                rawData = [];
                statusBadge.textContent = "เกิดข้อผิดพลาดระหว่างเปิดอ่านไฟล์";
                renderRawTable([]);
            };

            reader.readAsArrayBuffer(file);
        });

        // ฟังก์ชันวาดตารางแสดงผล (ใช้ DocumentFragment + textContent เพื่อความเร็วและปลอดภัยจาก XSS)
        function renderRawTable(dataList) {
            const thead = document.getElementById("tableHeader");
            const tbody = document.getElementById("tableBody");
            const countBadge = document.getElementById("rowCount");

            thead.replaceChildren();
            tbody.replaceChildren();

            if (!dataList || dataList.length === 0) {
                const emptyTr = document.createElement("tr");
                const emptyTd = document.createElement("td");
                emptyTd.className = "text-center py-12 text-slate-400";
                emptyTd.textContent = "ไม่พบข้อมูลในไฟล์นี้";
                emptyTr.appendChild(emptyTd);
                tbody.appendChild(emptyTr);
                countBadge.textContent = "ทั้งหมด 0 แถว";
                return;
            }

            // 1. รวมรายชื่อหัวตารางทั้งหมดจากทุกแถว (ไม่ตกหล่นคอลัมน์ที่โผล่ในแถวถัดไป)
            const headerSet = new Set();
            dataList.forEach(row => {
                Object.keys(row).forEach(key => headerSet.add(key));
            });
            const headers = Array.from(headerSet);

            // 2. สร้างหัวตาราง (ใส่คอลัมน์ลำดับที่ไว้หน้าสุด)
            const headFragment = document.createDocumentFragment();
            const indexTh = document.createElement("th");
            indexTh.className = "px-4 py-3 whitespace-nowrap bg-slate-200/70 w-12 text-center";
            indexTh.textContent = "#";
            headFragment.appendChild(indexTh);

            headers.forEach(header => {
                const th = document.createElement("th");
                th.className = "px-4 py-3 whitespace-nowrap";
                th.textContent = header;
                headFragment.appendChild(th);
            });
            thead.appendChild(headFragment);

            // 3. วนลูปสร้างข้อมูลทีละแถวด้วย DocumentFragment
            const bodyFragment = document.createDocumentFragment();
            dataList.forEach((row, index) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-blue-50/50 transition-colors";

                const indexTd = document.createElement("td");
                indexTd.className = "px-4 py-2.5 text-center text-xs text-slate-400 font-medium bg-slate-50/50 tabular-nums";
                indexTd.textContent = String(index + 1);
                tr.appendChild(indexTd);

                headers.forEach(header => {
                    const td = document.createElement("td");
                    td.className = "px-4 py-2.5 whitespace-nowrap";
                    const rawVal = row[header];
                    const isEmpty = rawVal === "" || rawVal === null || rawVal === undefined;
                    td.textContent = isEmpty ? "-" : String(rawVal);
                    tr.appendChild(td);
                });

                bodyFragment.appendChild(tr);
            });
            tbody.appendChild(bodyFragment);

            countBadge.textContent = `ทั้งหมด ${dataList.length} แถว`;
        }
    </script>
</body>
</html>
